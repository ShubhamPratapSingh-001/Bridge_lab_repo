<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body {
            margin: 0;
            background-color: rgb(12, 5, 5);
            justify-content: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        body1 {
            text-align: center;
            justify-content: center;
            display: flex;
            background-color: rgb(36, 105, 11);
        }

        header {
            background-color: rgba(23, 21, 21, 0);
        }

        form {
            padding: 30px;
            width: 600;
            border-radius: 10px;
            background-color: blanchedalmond;
        }

        label {
            background-color: brown(128, 0, 0);
        }

        h1 {
            text-align: center;
            background-color: rgb(254, 252, 252);
        }
    </style>
</head>

<body>
    <br />
    <form action="/register" method="post">
        <!-- <input type="email" id="email" name="email"> -->
        <h1>Student Registration Form</h1>
        <br />

        <label>Gender</label>

        <input type="radio" value="male" id="male" name="gender" />
        <label for="male">Male</label>

        <input type="radio" value="female" id="female" name="gender" />
        <label for="female">Female</label>
        <br /><br />

        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name" placeholder="Name of Student" required />

        <br /><br />

        <label for="email">Email ID:</label>
        <input type="text" id="name" name="name" placeholder="enter your email" required />

        <br /><br />

        <label for="name">University Name:</label>
        <input type="text" id="name" name="name" placeholder="enter your Univerity Name" />
        <br />
        <br />
        <label for="name">DOB:</label>
        <input type="date" id="name" name="name" placeholder="enter your DOB" />
        <br /><br />
        <label for="name">Skill:</label>
        <select id="Skill" name="skill">
            <option value="">Select your skill</option>
            <option value="java">Java</option>
            <option value="c++">c++</option>
            <option value="python">python</option>
            <option value="css">css</option>
        </select>
        <br /><br />
        <h3>Choose your address</h3>
        <map>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d14141.803879408915!2d77.5979008!3d27.6105464!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1787220414738!5m2!1sen!2sin"
                width="600" height="450" style="border: 0" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </map>
        <br /><br />
        <iframe width="560" height="315" src="https://www.youtube.com/embed/HcOc7P5BMi4?si=njX-06bMNJrghUjM"
            title="YouTube video player" frameborder="0" allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        " referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br /><br />
        <label for="name">CV:</label>
        <input type="file" id="name" name="name" placeholder="Upload Your CV" />

        <br /><br />
        <input type="submit" id="name" name="name" value="submit." />
    </form>

    <br />
</body>

</html>
